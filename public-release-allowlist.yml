# ABIS Reference Runtime — Public Release Allowlist
# M229D-006 — default: UNKNOWN_NOT_PUBLIC

version: "0.1"
updated: "2026-09-21"
repository: abis-standard/abis-reference-runtime
default_rule: UNKNOWN_NOT_PUBLIC

allowed_paths:
  - README.md
  - CHANGELOG.md
  - LICENSE
  - VALIDATION.md
  - QUICK-VALIDATION.md
  - INTEGRATION.md
  - pyproject.toml
  - .gitignore
  - public-release-allowlist.yml
  - .github/**
  - scripts/**
  - examples/**
  - reference-business/**
  - runtime/**
  - tests/**
  - validation/**
  - .abis/disclosure-approval.json
